name: Deploy SQAuto to Azure VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sqauto-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm --prefix apps/web run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall apps/api services

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "apps,configs,docker,services,requirements.txt,package.json,package-lock.json,.dockerignore,.gitignore"
          target: "~/SQAuto"
          overwrite: true
          rm: false
          strip_components: 0

      - name: Rebuild and restart on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          METADATA_DATABASE_URL: ${{ secrets.METADATA_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: METADATA_DATABASE_URL,STAGING_DATABASE_URL,DATABASE_URL,REDIS_URL,SECRET_KEY,NEXT_PUBLIC_API_URL
          script: |
            set -eu

            mkdir -p ~/SQAuto
            cd ~/SQAuto

            cat > .env <<EOF
            METADATA_DATABASE_URL=${METADATA_DATABASE_URL}
            STAGING_DATABASE_URL=${STAGING_DATABASE_URL}
            DATABASE_URL=${DATABASE_URL}
            REDIS_URL=${REDIS_URL}
            SECRET_KEY=${SECRET_KEY}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            EOF

            docker compose -f docker/docker-compose.yml down
            docker compose -f docker/docker-compose.yml up -d --build --remove-orphans
            docker compose -f docker/docker-compose.yml ps
