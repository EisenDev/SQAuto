name: Deploy SQAuto to Azure VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sqauto-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm --prefix apps/web run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall apps/api services

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          set -eu
          mkdir -p ~/.ssh
          if printf '%s' '${{ secrets.VM_SSH_KEY }}' | grep -q 'BEGIN .* PRIVATE KEY'; then
            printf '%s\n' '${{ secrets.VM_SSH_KEY }}' > ~/.ssh/sqauto_vm_key
          else
            printf '%s' '${{ secrets.VM_SSH_KEY }}' | base64 -d > ~/.ssh/sqauto_vm_key
          fi
          chmod 600 ~/.ssh/sqauto_vm_key
          ssh-keygen -y -f ~/.ssh/sqauto_vm_key >/tmp/sqauto_vm_key.pub
          ssh-keygen -lf ~/.ssh/sqauto_vm_key
          ssh-keyscan -H '${{ secrets.VM_HOST }}' >> ~/.ssh/known_hosts

      - name: Rebuild and restart on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          METADATA_DATABASE_URL: ${{ secrets.METADATA_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -eu

          ssh -i ~/.ssh/sqauto_vm_key "${VM_USER}@${VM_HOST}" \
            "export METADATA_DATABASE_URL='${METADATA_DATABASE_URL}' \
             STAGING_DATABASE_URL='${STAGING_DATABASE_URL}' \
             DATABASE_URL='${DATABASE_URL}' \
             REDIS_URL='${REDIS_URL}' \
             SECRET_KEY='${SECRET_KEY}' \
             NEXT_PUBLIC_API_URL='${NEXT_PUBLIC_API_URL}'; \
             bash -se" <<'EOF'
          set -eu

          cd ~/SQAuto

          git fetch origin main
          git reset --hard origin/main

          cat > .env <<ENVEOF
          METADATA_DATABASE_URL=${METADATA_DATABASE_URL}
          STAGING_DATABASE_URL=${STAGING_DATABASE_URL}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          SECRET_KEY=${SECRET_KEY}
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          ENVEOF

          docker compose -f docker/docker-compose.yml down
          docker compose -f docker/docker-compose.yml up -d --build --remove-orphans
          docker compose -f docker/docker-compose.yml ps
          EOF
