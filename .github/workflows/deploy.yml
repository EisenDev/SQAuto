name: Deploy SQAuto to Azure VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sqauto-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm --prefix apps/web run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall apps/api services

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          set -eu
          mkdir -p ~/.ssh
          if printf '%s' '${{ secrets.VM_SSH_KEY }}' | grep -q 'BEGIN .* PRIVATE KEY'; then
            printf '%s\n' '${{ secrets.VM_SSH_KEY }}' > ~/.ssh/sqauto_vm_key
          else
            printf '%s' '${{ secrets.VM_SSH_KEY }}' | base64 -d > ~/.ssh/sqauto_vm_key
          fi
          chmod 600 ~/.ssh/sqauto_vm_key
          ssh-keygen -y -f ~/.ssh/sqauto_vm_key >/tmp/sqauto_vm_key.pub
          ssh-keygen -lf ~/.ssh/sqauto_vm_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -T 15 -H '${{ secrets.VM_HOST }}' >> ~/.ssh/known_hosts || true

      - name: Rebuild and restart on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu

          for attempt in 1 2 3 4 5; do
            if ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -i ~/.ssh/sqauto_vm_key "${VM_USER}@${VM_HOST}" 'bash -se' <<'EOF'
            set -eu

            cd ~/SQAuto

            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker/docker-compose.yml down
            docker compose -f docker/docker-compose.yml up -d --build --remove-orphans
            docker compose -f docker/docker-compose.yml ps
            EOF
            then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi

            echo "SSH deploy attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
