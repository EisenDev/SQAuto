# docker/nginx.conf
# Production Nginx config — reverse proxy for SQAuto
# Handles: TLS termination (optional), large SQL uploads, WebSocket upgrades

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Allow large SQL file uploads (up to 2 GB)
    client_max_body_size  2G;
    client_body_timeout   18000s;

    # Proxy timeouts (5 hours — matches gunicorn timeout)
    proxy_connect_timeout 90s;
    proxy_send_timeout    18000s;
    proxy_read_timeout    18000s;
    send_timeout          18000s;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # ─── Rate limiting zones ─────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=upload_limit:10m  rate=5r/m;

    # ─── Upstream definitions ─────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 16;
    }

    upstream web_backend {
        server web:3000;
        keepalive 16;
    }

    # ─── Main server block ────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Health check (used by nginx container healthcheck) ────
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Next.js Auth API routes ───────────────────────────────
        location /api/auth/ {
            proxy_pass http://web_backend/api/auth/;
        }

        # ── API routes ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://api_backend/api/;

            # Large upload support
            client_max_body_size  2G;
            proxy_request_buffering off;
        }

        # ── File upload endpoint (tighter rate limit) ─────────────
        location /api/upload {
            limit_req zone=upload_limit burst=3 nodelay;

            proxy_pass http://api_backend/api/upload;

            client_max_body_size  2G;
            proxy_request_buffering off;
        }

        # ── Frontend (Next.js) ────────────────────────────────────
        location / {
            proxy_pass http://web_backend;

            # Next.js static assets — aggressive caching
            location ~* \.(js|css|ico|png|jpg|svg|woff2?)$ {
                proxy_pass http://web_backend;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
