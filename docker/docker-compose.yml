# docker/docker-compose.yml
services:
  nginx:
    image: nginx:alpine
    container_name: sqauto_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: always

  redis:
    image: redis:alpine
    container_name: sqauto_redis
    expose:
      - "6379"
    restart: always

  db_staging:
    image: postgres:15-alpine
    container_name: sqauto_db_staging
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=staging_db
    ports:
      - "5433:5432"
    volumes:
      - staging_data:/var/lib/postgresql/data
    restart: always

  api:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-eisendev}/sqauto-api:latest
    container_name: sqauto_api
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:${HOST_DOCKER_INTERNAL:-host-gateway}"
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis
      - db_staging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-eisendev}/sqauto-web:latest
    container_name: sqauto_web
    env_file: ../.env
    environment:
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    restart: always


volumes:
  uploads:
  staging_data:
