version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: sqauto_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    container_name: sqauto_api
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - redis
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    container_name: sqauto_web
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: npm run dev:web -- -p 3000 -H 0.0.0.0

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    container_name: sqauto_worker
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: python -m workers.migration_worker.worker
