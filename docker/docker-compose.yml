# docker/docker-compose.yml
# Production compose file — used on the Azure VM.
# Images are pulled from GHCR after CI builds them.
# Required env vars on the VM: see .env.example
# Run: docker compose -f docker/docker-compose.yml up -d

services:

  # ─── Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sqauto_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Cache / Broker ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sqauto_redis
    command: redis-server --save 60 1 --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


  # ─── Staging Database ────────────────────────────────────────
  db_staging:
    image: postgres:15-alpine
    container_name: sqauto_db_staging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_STAGING_PASSWORD:-postgres}
      POSTGRES_DB: staging_db
    ports:
      - "${SQAUTO_STAGING_DB_PORT:-55433}:5432"
    volumes:
      - staging_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staging_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API (FastAPI) ───────────────────────────────────────────
  api:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/sqauto-api:${IMAGE_TAG:-latest}
    container_name: sqauto_api
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STAGING_DATABASE_URL: postgresql+psycopg://postgres:${DB_STAGING_PASSWORD:-postgres}@db_staging:5432/staging_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db_staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 5
    restart: always

  # ─── Celery Worker ───────────────────────────────────────────
  worker:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/sqauto-worker:${IMAGE_TAG:-latest}
    container_name: sqauto_worker
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STAGING_DATABASE_URL: postgresql+psycopg://postgres:${DB_STAGING_PASSWORD:-postgres}@db_staging:5432/staging_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db_staging:
        condition: service_healthy
    restart: on-failure

  # ─── Web (Next.js) ───────────────────────────────────────────
  web:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/sqauto-web:${IMAGE_TAG:-latest}
    container_name: sqauto_web
    env_file: ../.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: always

# ─── Named Volumes ──────────────────────────────────────────────
volumes:
  uploads:
  redis_data:
  staging_data:
