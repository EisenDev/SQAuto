# docker/docker-compose.yml
version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: sqauto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: always

  redis:
    image: redis:alpine
    container_name: sqauto_redis
    expose:
      - "6379"
    restart: always

  api:
    image: ${DOCKER_HUB_USERNAME:-sqauto}/sqauto-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    container_name: sqauto_api
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis
    restart: always

  web:
    image: ${DOCKER_HUB_USERNAME:-sqauto}/sqauto-web:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    container_name: sqauto_web
    env_file: ../.env
    environment:
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    restart: always

  worker:
    image: ${DOCKER_HUB_USERNAME:-sqauto}/sqauto-worker:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    container_name: sqauto_worker
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - uploads:/app/uploads
    restart: always

volumes:
  uploads:
