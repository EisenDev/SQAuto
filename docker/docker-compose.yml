# docker/docker-compose.yml
version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: sqauto_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: always

  redis:
    image: redis:alpine
    container_name: sqauto_redis
    expose:
      - "6379"
    restart: always

  api:
    image: ${DOCKER_HUB_USERNAME:-sqauto}/sqauto-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    container_name: sqauto_api
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    image: ${DOCKER_HUB_USERNAME:-sqauto}/sqauto-web:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://sqauto.zeraynce.com/api}
    container_name: sqauto_web
    env_file: ../.env
    environment:
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    restart: always


volumes:
  uploads:
