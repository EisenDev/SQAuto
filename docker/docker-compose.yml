version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: sqauto_api
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    container_name: sqauto_web
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    command: npm run dev -- --port 3000 --host 0.0.0.0

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: sqauto_worker
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - api
    command: python -m workers.migration_worker.worker

  postgres:
    image: postgres:15-alpine
    container_name: sqauto_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sqauto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sqauto_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
